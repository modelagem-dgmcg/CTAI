<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema CTAI · Entrar</title>
<meta name="theme-color" content="#12303B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">
  <main class="login">
    <form class="cartao" id="form" autocomplete="on">
      <h1>Sistema CTAI</h1>
      <p class="mudo">Acompanhamento do Contrato de Gestão: envio da unidade, conferência e parecer.</p>
      <div class="campo"><label for="login">Usuário</label><input type="text" id="login" name="username" autocomplete="username" autocapitalize="none" required></div>
      <div class="campo"><label for="senha">Senha</label><input type="password" id="senha" name="password" autocomplete="current-password" required></div>
      <div class="msg-erro" id="erro" role="alert" style="color:#9B2335;min-height:1.4em"></div>
      <button type="submit" style="width:100%">Entrar</button>
      <p class="mudo peq" style="margin-top:14px">O sistema não guarda senha nem credencial do SEI. A assinatura dos documentos é feita no SEI.</p>
    </form>
  </main>
</div>
<script src="/js/core.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
